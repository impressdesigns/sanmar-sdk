version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      ci-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      python-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
    ignore:
      # SanMar's SFTP server offers only ssh-rsa, which paramiko 5 removed (see pyproject.toml).
      - dependency-name: paramiko
        versions: [">=5"]
      - dependency-name: types-paramiko
        versions: [">=5"]

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    groups:
      pre-commit-dependencies:
        patterns:
          - "*"
    cooldown:
      default-days: 7
