name: Dependency Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: impressdesigns/.github/.github/dependency-review-config.yaml@main
          # paramiko 4 still verifies ssh-rsa (SHA-1) host key signatures, which is all
          # SanMar's SFTP server offers; paramiko 5, the only fix, cannot connect to it.
          # Drop this once SanMar offers an rsa-sha2 or newer host key.
          allow-ghsas: GHSA-r374-rxx8-8654
          # paramiko is LGPL-2.1-only and its cffi dependency MIT-0, neither of which the shared
          # org config allows; paramiko is the SDK's SFTP client, used unmodified. This list
          # replaces the org config's own, so its two entries are repeated here.
          allow-dependencies-licenses: "pkg:pypi/paramiko, pkg:pypi/cffi, pkg:pypi/typing-extensions, pkg:pypi/pillow"
